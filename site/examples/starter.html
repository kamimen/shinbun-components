<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>はじめての紙面 | shinbun-components</title>
  <link rel="stylesheet" href="../dist/shinbun-components.min.css" />
  <script type="module" src="../dist/shinbun-components.min.js"></script>
  <style>
    body { margin: 0; padding: 1rem; background: #e8e2d0; }
  </style>
</head>
<body>
  <!-- All people, organizations and events here are fictional. -->
  <shinbun-paper dan="8" chars="10" font-size="0.8rem" auto-tcy>
    <shinbun-page>
      <header data-sb-span="3">
        <h1>かみめん新聞</h1>
        <p>第1号 10月11日</p>
      </header>

      <shinbun-article span="8" lead>
        <shinbun-headline size="l">町の図書館、夜も開館へ</shinbun-headline>
        <p>架空の町の図書館が、来月から平日の夜9時まで開館する。仕事帰りの住民から要望が多かったためで、館長は「静かに本を読める夜の居場所にしたい」と話している。</p>
        <shinbun-photo ratio="1 / 3">
          <img alt="" />
          <figcaption>夜の開館に向けて準備が進む閲覧室（写真は架空）</figcaption>
        </shinbun-photo>
        <p>開館時間の延長に合わせ、館内の照明を入れ替える。費用は約300万円で、町の予算から支出する。</p>
      </shinbun-article>

      <aside data-sb-span="4">
        <h3>ここに注目</h3>
        <p>夜の開館は試験的に半年間行い、利用状況を見て続けるかどうかを決める。</p>
      </aside>
    </shinbun-page>
  </shinbun-paper>
</body>
</html>
